<article class="card">
    <div class="card-media">
        <span class="card-number">
            #{{ project().id.toString().padStart(2, '0') }}
        </span>

        <div
            class="card-slides"
            [style.transform]="'translateX(-' + (activeIndex() * 100) + '%)'"
        >
            @for (image of project().images; track $index) {
                <img
                    [src]="image"
                    [alt]="'Captura ' + ($index + 1) + ' de ' + project().title"
                    [attr.aria-hidden]="$index !== activeIndex()"
                >
            }
        </div>

        @if (project().images.length > 1) {
            <button
                class="card-arrow previous"
                type="button"
                [attr.aria-label]="'Imagen anterior de ' + project().title"
                (click)="previousImage()"
            >‹</button>

            <button
                class="card-arrow next"
                type="button"
                [attr.aria-label]="'Imagen siguiente de ' + project().title"
                (click)="nextImage()"
            >›</button>

            <div class="card-dots" [attr.aria-label]="'Imágenes de ' + project().title">
                @for (image of project().images; track $index) {
                    <button
                        type="button"
                        [class.active]="$index === activeIndex()"
                        [attr.aria-label]="'Mostrar imagen ' + ($index + 1)"
                        [attr.aria-current]="$index === activeIndex() ? 'true' : null"
                        (click)="goToImage($index)"
                    ></button>
                }
            </div>
        }
    </div>

    <div class="card-body">
        <h3>{{ project().title }}</h3>
        <p>{{ project().description }}</p>
    </div>

    <div class="card-links">
        <a [href]="project().repository" target="_blank" rel="noopener noreferrer">
            Repositorio
        </a>
        <a class="card-demo" [href]="project().demo" target="_blank" rel="noopener noreferrer">
            Ver demo
        </a>
    </div>
</article>
